name: Android Release

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      # - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        # maplibre_gl compiles its Android sources against Java 21, so the
        # runner needs at least that; Flutter's own toolchain ships 21 too.
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Set up Keystore
      run: |
        if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        else
          keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=GPSMock, OU=GPSMock, O=GPSMock, L=GPSMock, S=GPSMock, C=US"
        fi
      
    - name: Build Android Universal APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'password123' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'password123' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
      run: flutter pub get && flutter build apk --release

    - name: Rename APK
      run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/GPS Mock-Universal.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GPS-Mock-Universal-APK
        path: "build/app/outputs/flutter-apk/GPS Mock-Universal.apk"

    - name: Get Date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Get Version
      id: version
      run: echo "version=${{ steps.date.outputs.date }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') != true # Create release for main push or dispatch
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Stable Release v${{ steps.version.outputs.version }}
        files: "build/app/outputs/flutter-apk/GPS Mock-Universal.apk"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
